name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  frontend-tests:
    name: Run frontend tests, coverage and SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=gtins_frontend-sindigo
            -Dsonar.organization=gtins
            -Dsonar.sources=frontend/src
            -Dsonar.tests=frontend/src
            -Dsonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx
            -Dsonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**
            -Dsonar.coverage.exclusions=frontend/src/**/*.d.ts,frontend/src/vite-env.d.ts,frontend/src/main.tsx,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/assets/**,frontend/src/components/*Page.tsx,frontend/src/components/*Modal.tsx,frontend/src/components/BuildingDetails.tsx,frontend/src/components/BuildingFinances.tsx,frontend/src/components/BuildingFinancesReal.tsx,frontend/src/components/Sidebar.tsx,frontend/src/components/TopBar.tsx,frontend/src/components/ItemDetailsModal.tsx,frontend/src/App.tsx,frontend/src/services/api.ts,frontend/src/services/authService.ts,frontend/src/services/condominiumService.ts,frontend/src/services/reportService.ts,frontend/src/services/attachmentService.ts,frontend/src/utils/customAlert.ts,frontend/src/data/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage